<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Checkout / Pedido</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background: #020617;
            padding: 24px;
            border-radius: 10px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4);
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }

        label {
            display: block;
            margin-top: 14px;
            font-size: 14px;
            color: #cbd5f5;
        }

        input, select {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            background: #020617;
            color: #e5e7eb;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #38bdf8;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #020617;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

<form method="POST" action="/prepag2/commerce/pagamento_int.php">
    <h2>Dados do Pedido</h2>

    <label for="store_id">Store ID</label>
    <input type="number" id="store_id" name="store_id" value="10427" required>

    <label for="currency_code">Moeda</label>
    <select id="currency_code" name="currency_code">
        <option value="BRL" selected>BRL - Real Brasileiro</option>
        <option value="USD">USD - Dólar</option>
        <option value="EUR">EUR - Euro</option>
    </select>

    <label for="order_id">Order ID</label>
    <input type="text" id="order_id" name="order_id" value="202512180228676" required>

    <label for="order_description">Descrição do Pedido</label>
    <input type="text" id="order_description" name="order_description"
           value="100000.00 Z8Games Points.">

    <label for="product_id">Product ID</label>
    <input type="number" id="product_id" name="product_id" value="145">

    <label for="amount">Valor</label>
    <input type="number" id="amount" name="amount" value="9999" step="0.01" required>

    <label for="client_id">Client ID</label>
    <input type="number" id="client_id" name="client_id" value="15251489">

    <label for="client_email">Email do Cliente</label>
    <input type="email" id="client_email" name="client_email"
           value="briguitim189@gmail.com" required>

    <label for="client_name">Nome do Cliente</label>
    <input type="text" id="client_name" name="client_name" value="">

    <label for="language">Idioma</label>
    <select id="language" name="language">
        <option value="">Automático</option>
        <option value="pt-BR">Português (BR)</option>
        <option value="en-US">Inglês</option>
        <option value="es-ES">Espanhol</option>
    </select>

    <button type="submit">Enviar Pedido</button>
</form>

</body>
</html>
