name: EprepagApp
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile_hml
    extra_hosts:
      - "hml.e-prepag.com.br:127.0.0.1"
      - "hml.backoffice.e-prepag.com.br:127.0.0.1"
    ports:
      - 82:80
      - 445:443
    networks:
      - default
    volumes:
      - ./www/:/www/
      - ./docker-config/certs:/etc/apache2/certs/
    environment:
      TZ: 'America/Sao_Paulo'
      env_file: ./www/.env

  assinador:
    build: ./assinador-dotnet
    container_name: assinador-dotnet
    networks:
      - default
    ports:
      - "5000:5000"
    volumes:
      - ./certs:/certs:ro           # Acesso ao certificado (read-only)
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    driver: bridge
