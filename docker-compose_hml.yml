name: EprepagApp
services:
  app:
    build: .
    dockerfile: Dockerfile_hml
    extra_hosts:
      - "hml.e-prepag.com.br:127.0.0.1"
      - "hml.backoffice.e-prepag.com.br:127.0.0.1"
    ports:
      - 82:80
      - 445:443
    networks:
      - default
    volumes:
      - ./www/:/www/
      - ./docker-config/certs:/etc/apache2/certs/
    environment:
      TZ: 'America/Sao_Paulo'
      env_file: ./www/.env


networks:
  default:
    driver: bridge
