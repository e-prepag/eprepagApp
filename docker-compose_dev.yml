name: EprepagApp

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile_dev
    extra_hosts:
      - "dev.e-prepag.com.br:127.0.0.1"
      - "backoffice-dev.e-prepag.com.br:127.0.0.1"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - eprepag_net
    volumes:
      - ./www:/www
      - ./docker-config/certs_local:/etc/apache2/certs
      - ./www/arquivos_gerados:/www/arquivos_gerados
    environment:
      TZ: "America/Sao_Paulo"
      env_file: ./www/.env

  assinador:
    build: ./assinador-dotnet
    container_name: assinador-dotnet
    networks:
      - eprepag_net
    ports:
      - "5000:5000"
    volumes:
      - ./certs:/certs:ro           # Acesso ao certificado (read-only)
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=America/Sao_Paulo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  eprepag_net:
    driver: bridge
