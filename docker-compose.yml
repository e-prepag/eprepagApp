name: EprepagApp

services:
  app:
    build: .
    extra_hosts:
      - "hml.e-prepag.com.br:127.0.0.1"
      - "hml.backoffice.e-prepag.com.br:127.0.0.1"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - eprepag_net
    volumes:
      - ./www:/www
      - ./docker-config/certs_local:/etc/apache2/certs
      - ./www/arquivos_gerados:/www/arquivos_gerados
    environment:
      TZ: "America/Sao_Paulo"
      env_file: ./www/.env

  assinador:
    build: ./assinador
    container_name: assinador-python
    networks:
      - eprepag_net
    ports:
      - "5000:5000"                 # acesso local (pode fechar em produção)
    volumes:
      - ./assinador:/app            # hot reload do código Python
      - ./certs:/certs:ro           # acesso ao certificado
    environment:
      - FLASK_ENV=development
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000

networks:
  eprepag_net:
    driver: bridge
