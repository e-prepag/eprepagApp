name: eprepag-php8

services:
  # Container do PHP (Interpretador)
  app:
    build:
      context: .
      dockerfile: Dockerfile_php8
    container_name: eprepag-app-php8
    restart: unless-stopped
    volumes:
      - ./www:/www:ro # Unificado: Tudo em /www para bater com o código legado
      - ./www/arquivos_gerados:/www/arquivos_gerados:rw
      - ./www/tmp:/www/tmp:rw
    networks:
      - backend_net
    env_file:
      - ./www/.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # Container do Nginx (Servidor Web)
  web:
    image: nginx:alpine
    container_name: eprepag-web-php8
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./www:/www:ro
      - ./docker-config/nginx/nginx_php8.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker-config/certs_local:/etc/nginx/certs:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Serviço Assinador .NET
  assinador:
    build: ./assinador-dotnet
    container_name: eprepag-assinador-php8
    restart: unless-stopped
    networks:
      - backend_net
    volumes:
      - ./certs:/certs:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true
