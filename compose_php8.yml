name: eprepag-php8

services:
  # Container do PHP (Interpretador)
  app:
    build:
      context: .
      dockerfile: Dockerfile_php8
    container_name: eprepag-app-php8
    restart: unless-stopped
    volumes:
      - ./www:/www/app:ro # Somente leitura para o código fonte
      - ./www/public_html/imagens:/www/app/public_html/imagens:ro # Montagem direta das imagens
      - ./www/arquivos_gerados:/www/arquivos_gerados:rw
      - ./www/tmp:/www/tmp:rw
    networks:
      - backend_net
    env_file:
      - ./www/.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # Container do Nginx (Servidor Web)
  web:
    image: nginx:alpine
    container_name: eprepag-web-php8
    restart: unless-stopped
    ports:
      - "8080:80" # Porta 8080 no host para evitar conflito com a porta 80 do Apache atual
    volumes:
      - ./www:/www:ro
      - ./docker-config/nginx/nginx_php8.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net
      - backend_net
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Serviço Assinador .NET (Auxiliar)
  assinador:
    build: ./assinador-dotnet
    container_name: eprepag-assinador-php8
    restart: unless-stopped
    networks:
      - backend_net # Isolado, não acessível pelo frontend/internet diretamente
    volumes:
      - ./certs:/certs:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    security_opt:
      - no-new-privileges:true

networks:
  frontend_net:
    driver: bridge
    internal: false
  backend_net:
    driver: bridge
    internal: true # Esta rede é isolada da internet
