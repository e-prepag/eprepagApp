# Configuração Global
server_tokens off;

# --- SITE PRINCIPAL: e-prepag.com.br ---
server {
    listen 80;
    listen 443 ssl;
    server_name www.e-prepag.com.br e-prepag.com.br;

    ssl_certificate /etc/nginx/certs/e-prepag.com.br.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/e-prepag.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /www/public_html;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Emula o .htaccess da pasta /imagens/ com prioridade máxima
    location ^~ /imagens/ {
        root /www/public_html;
        try_files $uri /imagens/index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass app:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTPS $https if_not_empty;
        }
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=30s;
        set $upstream_app app;
        fastcgi_pass $upstream_app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $https if_not_empty;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}

# --- BACKOFFICE: backoffice.e-prepag.com.br ---
server {
    listen 80;
    server_name backoffice.e-prepag.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name backoffice.e-prepag.com.br;

    ssl_certificate /etc/nginx/certs/e-prepag.com.br.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/e-prepag.com.br.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/backoffice;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTPS $https if_not_empty;
    }
}

