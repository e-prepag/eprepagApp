<VirtualHost *:80>
    ServerName backoffice.e-prepag.com.br
    ServerAdmin webmaster@localhost
    DocumentRoot /www/backoffice

    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/.well-known/acme-challenge/
    RewriteRule ^ - [L]

    # Redireciona para HTTPS
    Redirect permanent ^/(.*) https://backoffice.e-prepag.com.br/$1
</VirtualHost>


<VirtualHost *:443>
    ServerName backoffice.e-prepag.com.br
    ServerAdmin webmaster@localhost
    DocumentRoot /www/backoffice

    # Logs
    #ErrorLog ${APACHE_LOG_DIR}/error.log
    #CustomLog ${APACHE_LOG_DIR}/access.log combined

#    # Configurações SSL
    SSLEngine on
    SSLCertificateFile /etc/apache2/certs/e-prepag.com.br.crt
    SSLCertificateKeyFile /etc/apache2/certs/e-prepag.com.br.key

</VirtualHost>

<Directory "/www/backoffice/">
    #Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

